name: TravelWise CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore TravelWise.sln
      - run: dotnet build TravelWise.sln --no-restore --configuration Release
  agentic-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ai-service/requirements.txt pytest
      - run: pytest ai-service/tests
